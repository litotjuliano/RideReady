name: CI

on:
  pull_request:
  push:
    branches: [develop, uat, staging, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore App/RideReady.csproj

      - name: Build
        run: dotnet build App/RideReady.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test App/RideReady.csproj --configuration Release --no-build --verbosity normal
